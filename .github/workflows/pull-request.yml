name: Unit Tests (Multi-platform)

on:
  pull_request:
    branches: [ main, qa, dev ]

jobs:
  test:
    if: github.event.pull_request.draft == false
    name: Test on ${{ matrix.os }} (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: lint + asan
            sanitizer: asan
            extra_cmake_args: "-DENABLE_LINT=ON"
          - os: ubuntu-latest
            name: tsan
            sanitizer: tsan
          - os: macos-latest
            name: asan
            sanitizer: asan
          - os: macos-latest
            name: tsan
            sanitizer: tsan
          - os: windows-latest
            name: no sanitizers
            sanitizer: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install just
        uses: taiki-e/install-action@just

      # --- RUST SETUP ---
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # --- C++ / LLVM / DOCUMENTATION DEPENDENCIES ---
      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y clang clangd lldb lld llvm clang-tidy clang-tools cmake ninja-build cppcheck lcov

      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm cmake ninja cppcheck lcov

      - name: Install Dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake ninja cppcheck llvm

      # --- EXECUTION ---
      - name: Run Execution Pipeline
        if: matrix.sanitizer == ''
        run: |
          just config-dev
          just build-dev
          just test-dev

      - name: Run Sanitizer Pipeline
        if: matrix.sanitizer != ''
        run: |
          cmake --preset debug-${{ matrix.sanitizer }} ${{ matrix.extra_cmake_args }}
          cmake --build --preset build-debug-${{ matrix.sanitizer }} --parallel
          ctest --preset test-debug-${{ matrix.sanitizer }} -j4
